version: 2

project_name: pocketfuse

before:
  hooks:
    - go mod tidy
    # The Go server embeds web/dist via go:embed, so the SPA must be built
    # before compiling. pnpm is provided by corepack (packageManager pin).
    - pnpm --dir ./web install --frozen-lockfile
    - pnpm --dir ./web run build

builds:
  - id: pocketfuse
    main: ./cmd/pocketfuse
    binary: pocketfuse
    env:
      # modernc.org/sqlite is pure Go — cross-compiles to all targets.
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: open-ai-sdk
    name: pocketfuse
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
