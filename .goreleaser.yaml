version: 2

project_name: pocketfuse

before:
  hooks:
    - go mod tidy
    # The Go server embeds web/dist via go:embed, so the SPA must be built
    # before compiling. pnpm is provided by corepack (packageManager pin).
    - pnpm --dir ./web install --frozen-lockfile
    - pnpm --dir ./web run build

builds:
  - id: pocketfuse
    main: ./cmd/pocketfuse
    binary: pocketfuse
    env:
      # modernc.org/sqlite is pure Go — cross-compiles to all targets.
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Multi-arch GHCR image built from the binaries above via `docker buildx
# build --push` (single step, no separate docker job). The Dockerfile only
# copies linux/<arch>/pocketfuse from the staged build context.
dockers_v2:
  - id: pocketfuse
    images:
      - ghcr.io/open-ai-sdk/pocketfuse
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      "org.opencontainers.image.description": "Pocketfuse — local-first LLM tracing"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"

release:
  github:
    owner: open-ai-sdk
    name: pocketfuse
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
