name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: GoReleaser (binaries + GitHub release + GHCR image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "./go.mod"
          cache-dependency-path: "./go.sum"

      # working-directory + run-install:false keep setup-vp from running
      # `vp install` at the repo root (it creates a root package.json /
      # lockfile / node_modules and fails goreleaser's dirty-git check —
      # the before-hooks install inside web/ themselves).
      - name: Setup Vite+ toolchain
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          working-directory: web
          run-install: false
          cache: true

      # dockers_v2 builds linux/amd64 + linux/arm64 manifests in one
      # `docker buildx build --push`; QEMU emulates the alpine `apk` steps
      # for the non-native arch (binaries are cross-compiled natively).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
