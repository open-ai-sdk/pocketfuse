name: CI

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".goreleaser.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - ".goreleaser.yaml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "./go.mod"
          cache-dependency-path: "./go.sum"

      - name: Stub embedded frontend
        # go:embed needs web/dist to exist; lint only typechecks its contents.
        run: |
          mkdir -p web/dist
          printf '<!doctype html><title>ci stub</title>' > web/dist/index.html

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "./go.mod"
          cache-dependency-path: "./go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Stub embedded frontend
        # go:embed needs web/dist to exist; unit tests never read its contents.
        run: |
          mkdir -p web/dist
          printf '<!doctype html><title>ci stub</title>' > web/dist/index.html

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+ toolchain
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Format, lint, typecheck
        run: |
          pnpm --dir web run check
          pnpm --dir web run typecheck

      - name: Test
        run: pnpm --dir web run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "./go.mod"
          cache-dependency-path: "./go.sum"

      - name: Setup Vite+ toolchain
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --snapshot
