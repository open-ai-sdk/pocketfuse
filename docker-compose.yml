services:
  pocketfuse:
    # Runs the published image by default; `make docker-up` overrides this
    # with the locally built pocketfuse:local.
    image: ${POCKETFUSE_IMAGE:-ghcr.io/open-ai-sdk/pocketfuse:latest}
    environment:
      # The process always listens on 7625 inside the container. The value of
      # POCKETFUSE_PORT controls the host port in the mapping below.
      POCKETFUSE_HOST: 0.0.0.0
      POCKETFUSE_PORT: 7625
      POCKETFUSE_DB_PATH: ${POCKETFUSE_DB_PATH:-/data/pocketfuse.db}
    ports:
      - "${POCKETFUSE_PORT:-7625}:7625"
    volumes:
      - "${POCKETFUSE_DATA_DIR:-./data}:/data"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:7625/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
